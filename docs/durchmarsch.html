<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ANDY verstehen – Durchmarsch V0.3</title>
<style>
:root{--bg:#f7f7f5;--ink:#202226;--muted:#656a70;--line:#d6d7d6;--side:#ebebea;--accent:#242a32}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:#191d24;color:#fff;padding:16px 26px;display:flex;justify-content:space-between;gap:20px;align-items:center}
header b{font-size:19px}header small{color:#c5c7cc}.shell{display:grid;grid-template-columns:275px minmax(0,1fr);max-width:1450px;min-height:calc(100vh - 67px);margin:auto}
aside{background:var(--side);border-right:1px solid var(--line);padding:25px 17px}aside p{font-size:12px;color:var(--muted)}aside h2{font-size:12px;letter-spacing:.09em;color:#5f646b;text-transform:uppercase}
nav button{display:block;width:100%;padding:10px 12px;border:0;border-radius:7px;background:transparent;text-align:left;font:inherit;font-size:14px;cursor:pointer;color:#252932}
nav button[aria-current="page"]{background:var(--accent);color:#fff}main{padding:40px clamp(24px,5vw,78px);max-width:1100px}
article{max-width:940px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}h1{font-size:clamp(30px,4vw,46px);line-height:1.15;margin:10px 0 23px}h2{margin:25px 0 9px;font-size:22px}
p{max-width:780px}.lede{font-size:20px;line-height:1.5}.card{border:1px solid var(--line);border-radius:12px;background:white;padding:22px;margin:20px 0}
.note{border-left:4px solid #8a8d91;padding:14px 18px;background:#eaeae8;margin:22px 0;max-width:780px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:13px}.grid .card{margin:0}.card h3{margin:0 0 8px}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin:20px 0}
button.pill{cursor:pointer;background:white;color:#222;border:1px solid #a7a8a8;padding:9px 13px;border-radius:7px;font:inherit;font-size:14px}
button.pill[aria-pressed=true]{background:#222;color:white}button:disabled{opacity:.4;cursor:default}
.board-frame{max-width:590px}.board-wrap{display:grid;grid-template-columns:26px minmax(0,1fr);gap:4px;align-items:center}
.board{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));border:2px solid #272727;width:100%;aspect-ratio:1}
.sq{position:relative;display:flex;align-items:center;justify-content:center;aspect-ratio:1;background:#f1f1ef;border:.4px solid #777}
.sq.dark{background:#bababa}.sq .piece{font-family:"DejaVu Sans","Arial Unicode MS",serif;font-size:clamp(15px,2.7vw,31px);line-height:1;text-shadow:0 0 1px #000}
.sq .piece.white{color:white;-webkit-text-stroke:.7px #171717}.sq .piece.black{color:#1d1d1d}
.sq.highlight{outline:3px solid #252525;outline-offset:-3px}.sq .index{position:absolute;top:1px;left:3px;font-size:9px;color:#595959}
.sq .stone{position:absolute;right:-9%;bottom:-9%;width:25%;height:25%;background:#151515;border-radius:100%;border:1px solid white;z-index:2}
.sq .stone.white{background:#fff;border:1px solid #222}
.caption{font-size:12px;color:var(--muted);margin-top:10px}
pre{background:#eee;padding:14px;overflow:auto;font-size:12px}a{color:#343a45}
.navbottom{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:22px;margin-top:45px}
[hidden]{display:none!important}footer{font-size:12px;color:var(--muted);margin-top:32px}
@media(max-width:780px){header{padding:13px 16px}.shell{display:block}aside{padding:10px 14px}aside h2,aside p{display:none}nav{display:flex;overflow:auto;gap:5px}nav button{width:auto;white-space:nowrap}main{padding:25px 18px}.sq .piece{font-size:clamp(10px,3.8vw,22px)}}@media print{header,aside,.controls,.navbottom{display:none}.shell{display:block}main{max-width:none}.card{break-inside:avoid}}

.navtop{position:sticky;top:0;z-index:15;display:flex;align-items:center;justify-content:space-between;gap:12px;background:rgba(247,247,245,.97);border-bottom:1px solid var(--line);padding:12px 0 14px;margin:-12px 0 24px;backdrop-filter:blur(10px)}.navtop span{font-size:12px;color:var(--muted);text-align:center}
.board-frame{max-width:640px}.board-wrap{display:block}.axis-top{display:grid;grid-template-columns:repeat(13,1fr);margin:0 24px 4px 22px}.axis-top span{text-align:center;font-size:10px;font-weight:600}
.board-and-axis{display:grid;grid-template-columns:minmax(0,1fr) 24px;gap:3px}.axis-right{display:grid;grid-template-rows:repeat(13,1fr);align-items:center;justify-items:center;font-size:10px;font-weight:600}
.sq .chess-label{position:absolute;top:0;left:2px;font-size:clamp(7px,1vw,10px);font-weight:700;z-index:2;color:#303030}
.sq .go-node{position:absolute;top:-4px;left:-4px;width:7px;height:7px;border-radius:50%;background:#222;z-index:4;box-shadow:0 0 0 1px white}
.legend{font-size:13px;color:#454545;margin-top:10px}.hint{font-size:12px;color:var(--muted)}
</style></head><body>
<header><div><b>ANDY <span style="font-weight:400">/ verstehen</span></b><div><small>WPS-02 · schneller HTML-Durchmarsch V0.3</small></div></div><small>Entwurf · 11.11.2026</small></header>
<div class="shell"><aside><h2>Inhaltsverzeichnis</h2><nav id="nav"></nav><p>Erst Verständlichkeit prüfen, dann Regeln und Daten verifizieren. Keine Freigabe G1.</p></aside>
<main><div class="navtop" aria-label="Kapitelnavigation"><button class="pill" id="prev">← Zurück</button><span id="progress">Kapitel</span><button class="pill" id="next">Weiter →</button></div><article id="content" aria-live="polite"></article>

<footer>ANDY Working Paper Series · Durchmarschfassung · kein offizielles Regelwerk</footer>
</main></div>
<script>
const chapters=[
{key:'intro',short:'00 · Pitch',title:'Willkommen bei ANDY.',tag:'Einstieg',body:`
<p class="lede"><strong>ANDY – Das vielleicht schwerste Brettspiel der Welt.</strong></p>
<p>Was passiert, wenn Schach und Go nicht mehr getrennt gespielt werden, sondern sich gegenseitig beeinflussen?</p>
<p>ANDY verbindet beide auf einem gemeinsamen Brett. In der Arena treten KI-Modelle gegeneinander an; Menschen verfolgen und untersuchen ihre Entscheidungen. Dabei zählt nicht nur, wer gewinnt, sondern auch, welche Ressourcen eine Entscheidung verbraucht.</p>
<div class="note"><strong>Redaktioneller Hinweis:</strong> Dies ist hier eine gekürzte Vorschau. Für die veröffentlichte Fassung muss der bereits freigegebene Elevator Pitch aus <code>editorial/elevator-pitch/de.md</code> wortgetreu und zusammenhängend eingesetzt werden.</div>
<p><strong>Erleben. Erforschen. Erahnen.</strong></p>`},
{key:'contents',short:'01 · Überblick',title:'So ist dieses Handbuch aufgebaut.',tag:'Inhaltsverzeichnis',body:`<p class="lede">Wir gehen immer vom Bekannten zum Unbekannten: zuerst das Ziel, dann das Brett und seine Grundstellung – erst danach die Aktionen und Spielsituationen.</p>
<div class="grid"><div class="card"><h3>Verstehen</h3><p>Ziel, Brett, Koordinaten und vollständige Startaufstellung.</p></div><div class="card"><h3>Nachvollziehen</h3><p>Zugfolge sowie beispielhafte Anfangs-, Mittel- und Endsituationen.</p></div><div class="card"><h3>Einordnen</h3><p>Spielausgang, Ressourcenlimits und technische Abbrüche.</p></div></div>`},
{key:'goals',short:'02 · Ziele & Sieg',title:'Worum spielen wir?',tag:'Spielziel',body:`<p class="lede">Eine ANDY-Partie kombiniert zwei Regelwelten zu einem gemeinsamen Ergebnis. Man muss das Geschehen in Schach und Go zugleich beachten.</p>
<div class="grid"><div class="card"><h3>♚ Schach</h3><p>Matt ist nach den vorliegenden Architekturentwürfen ein möglicher Siegweg. Die genaue Bedingung muss mit der aktuellen Engine geprüft werden.</p></div><div class="card"><h3>● Go</h3><p>Eine Go-Kontrollschwelle wird als weiterer Siegweg genannt. Die Implementierung und der Wert sind noch unbestätigt.</p></div><div class="card"><h3>◷ Ressourcen</h3><p>In KI-Duellen zählen begrenzte Tokens und gegebenenfalls Zeit. Deren Erschöpfung ist keine Brettaktion.</p></div></div>
<div class="note"><strong>Wichtig:</strong> KO, TKO, TECH, Remis und Aufgabe sind noch nicht abschließend auf Code und Wettbewerbsauswertung abgeglichen. Die Begriffe sind hier nicht als freigegebene Regeln zu lesen.</div>
<p><a href="https://raw.githubusercontent.com/ANDY-Arena-com/andy-wps-collaboration/main/content/wps-02/01-ziele.md">Zum fachlichen Kapitelentwurf und Review</a></p>`},
{key:'geometry',short:'03 · Das Brett',title:'Ein Brett – zwei Geometrien.',tag:'Spielfläche',body:`<p class="lede">Bevor wir Züge zeigen, muss klar sein, was auf dem Brett ein Feld und was ein Schnittpunkt ist.</p>
<p>Die schematische Darstellung darunter unterscheidet die <strong>Flächen</strong> (Schach) und <strong>Gitterpunkte</strong> (Go). Die exakten ANDY-Zonen und ihre wechselseitige Wirkung sind noch anhand der Engine zu verifizieren.</p>
<div id="diagram"></div>
<div class="note">Der 13×13-Demonstrator ist in Graustufen. Eine markierte Zelle ist ein Feld; das Go-Gitter muss in der verbindlichen Fassung als separate Schnittpunkt-Ebene vektoriell korrekt eingezeichnet werden.</div>`},
{key:'setup',short:'04 · Startaufstellung',title:'Hier beginnt die Partie.',tag:'Vollständige Grundstellung',body:`<p class="lede">Eine ANDY-Partie beginnt mit allen Schachfiguren. Diese vollständige Grundstellung steht vor jedem Zugbeispiel.</p>
<div id="diagram"></div>
<p>Die 32 Schachfiguren sind in diesem <strong>noch nicht regelbestätigten Platzhalter</strong> auf einer zusammenhängenden 8×8-Fläche dargestellt. Die korrekte ANDY-Position, Blickrichtung und Go-Startbelegung werden im nächsten Arbeitsschritt aus dem Engine-State übernommen.</p>`},
{key:'coords',short:'05 · Koordinaten',title:'Wie benennen wir einen Ort?',tag:'Orientierung',body:`<p class="lede">Jede Erklärung braucht eindeutige Positionen. Wir müssen Schachfelder und Go-Schnittpunkte ohne Verwechslung benennen können.</p>
<div id="diagram"></div><p>Mit den Schaltern <strong>Schach / Go / Beides</strong> lassen sich die beiden Notationen separat oder gemeinsam sehen. Schach: klassische Felder <strong>A–H / 1–8</strong>; Go: Knoten <strong>a–m / 1–13</strong>. Die genaue Zuordnung der Schachzone auf dem Hybridbrett bleibt bis zum Engine-Abgleich ein Layoutbeispiel.</p>
<div class="note">Die beiden Notationsarten sind getrennt; die exakte Lage, Orientierung und Umsetzung auf dem ANDY-Brett werden noch mit der aktuellen Engine geprüft.</div>`},
{key:'turns',short:'06 · Zugablauf',title:'Was geschieht in einem Zug?',tag:'Aktionsrhythmus',body:`<p class="lede">Die Spielmechanik muss zuerst als klare Abfolge sichtbar werden. Erst dann erklären wir komplexe Wechselwirkungen.</p>
<div class="grid"><div class="card"><h3>1 · Zustand</h3><p>Die aktuelle Stellung beider Ebenen ist bekannt.</p></div><div class="card"><h3>2 · Aktion</h3><p>Eine legale Aktion verändert den Zustand.</p></div><div class="card"><h3>3 · Prüfung</h3><p>Engine prüft Folgewirkungen, nächste Zugberechtigung und gegebenenfalls das Ende.</p></div></div>
<div class="note">Diese drei Kästen erklären nur die Lernlogik, <strong>nicht den bestätigten ANDY-Aktionsrhythmus</strong>. Reihenfolge und zulässige Aktionstypen müssen aus der Engine folgen.</div>`},
{key:'opening',short:'07 · Anfang',title:'Anfang: Das erste Spannungsfeld.',tag:'Spielphase 1',body:`<p class="lede">Der Leser soll zuerst die vollständige Startaufstellung sehen und dann genau eine reale, gültige Aktion nachvollziehen.</p>
<div id="diagram"></div><p><strong>Geplant:</strong> Echte Startstellung → Aktion mit Koordinaten → neuer Zustand → kurze Erklärung der Regelwirkung.</p><div class="note">Im Demonstrator bleibt die Grundstellung unverändert: Eine konkrete ANDY-Aktion darf nicht erfunden werden.</div>`},
{key:'middle',short:'08 · Mitte',title:'Mitte: Beide Ebenen beeinflussen die Stellung.',tag:'Spielphase 2',body:`<p class="lede">Hier braucht es mindestens eine echte Partiestellung, an der sich eine Wechselwirkung zwischen Schach- und Go-Ebene nachvollziehen lässt.</p>
<div class="card"><h3>Lehrsequenz in vier Bildern</h3><p>Ausgangsposition → Aktion → Zustandsänderung → strategische Konsequenz.</p><p>Wir ergänzen diese Bilder aus einem geprüften Replay. Bis dahin keine erfundene Mittelspielposition.</p></div>`},
{key:'ending',short:'09 · Ende',title:'Ende: Warum ist die Partie entschieden?',tag:'Spielphase 3',body:`<p class="lede">Ein echtes Endspielbeispiel muss die letzte gültige Stellung, die entscheidende Aktion und den tatsächlich protokollierten Ergebniscode zeigen.</p>
<div class="grid"><div class="card"><h3>Brettentscheidung</h3><p>Beispiel nach Engine-Prüfung: ein vollständiger Matt- oder Go-Gewinn.</p></div><div class="card"><h3>Wettkampfentscheidung</h3><p>Beispiel mit nachweisbarer Budgetgrenze oder anderer Matchbedingung.</p></div></div>
<div class="note">Eine technische Unterbrechung darf nicht einfach als sportliche Niederlage umetikettiert werden.</div>`},
{key:'results',short:'10 · Ergebnisarten',title:'KO, TKO oder technischer Abbruch?',tag:'Nachschlagen',body:`<p class="lede">Eine gut erklärte Partie endet mit einem verständlichen Ergebnis – und mit einem Grund dafür.</p>
<div class="grid"><div class="card"><h3>KO · vorgeschlagen</h3><p>Ergebnis durch eine Brettregel.</p></div><div class="card"><h3>TKO · vorgeschlagen</h3><p>Ergebnis durch festgelegte Wettkampf-/Ressourcengrenzen.</p></div><div class="card"><h3>TECH · vorgeschlagen</h3><p>Abbruch ohne sportliche Entscheidung bei Infrastrukturfehler.</p></div></div>
<p><strong>Noch offen:</strong> tatsächliche Controller-Endcodes, illegale Aktionen, Parserfehler, Patt, Remis, Aufgabe und Ranglistenwertung.</p>`}
];
let current='intro',coordMode='both',showPieces=true;
const nav=document.getElementById('nav'),content=document.getElementById('content');
chapters.forEach(c=>{const b=document.createElement('button');b.textContent=c.short;b.dataset.key=c.key;b.addEventListener('click',()=>open(c.key));nav.append(b)});
function boardHTML(){return '<div class="board-frame"><div class="controls"><button class="pill" data-mode="chess" aria-pressed="'+(coordMode==='chess')+'">Schach A–H / 1–8</button><button class="pill" data-mode="go" aria-pressed="'+(coordMode==='go')+'">Go a–m / 1–13</button><button class="pill" data-mode="both" aria-pressed="'+(coordMode==='both')+'">Beides</button><button class="pill" id="pieces" aria-pressed="'+showPieces+'">Schachfiguren</button></div><div class="axis-top" id="goTop"></div><div class="board-and-axis"><div class="board" id="board"></div><div class="axis-right" id="goRight"></div></div><div class="legend" id="legend"></div><div class="caption">Monochromer Demonstrator · Schachfelder und Go-Knoten mit getrennter Notation · Lage der 8×8-Schachzone noch mit Engine zu prüfen</div></div>'}
function draw(){
 const board=document.getElementById('board');if(!board)return;
 board.replaceChildren();
 const isChess=coordMode==='chess'||coordMode==='both',isGo=coordMode==='go'||coordMode==='both';
 const goTop=document.getElementById('goTop'),goRight=document.getElementById('goRight');
 goTop.replaceChildren();goRight.replaceChildren();
 const letters='abcdefghijklm',files='ABCDEFGH';
 for(let i=0;i<13;i++){
  const a=document.createElement('span');a.textContent=isGo?letters[i]:'';goTop.append(a);
  const b=document.createElement('span');b.textContent=isGo?String(13-i):'';goRight.append(b);
 }
 const blacks=['♜','♞','♝','♛','♚','♝','♞','♜'],whites=['♖','♘','♗','♕','♔','♗','♘','♖'];
 for(let r=0;r<13;r++)for(let c=0;c<13;c++){
  const d=document.createElement('div');d.className='sq '+((r+c)%2?'dark':'light');
  if(isChess&&c>=2&&c<10&&r>=2&&r<10){
   const label=document.createElement('span');label.className='chess-label';label.textContent=files[c-2]+(10-r);d.append(label);
  }
  if(isGo){const node=document.createElement('span');node.className='go-node';node.title='Go-Knoten '+letters[c]+(13-r);node.setAttribute('aria-label','Go-Knoten '+letters[c]+(13-r));d.append(node)}
  if(showPieces&&c>=2&&c<10){
   let glyph='',side='';
   if(r===2){glyph=blacks[c-2];side='black'}
   if(r===3){glyph='♟';side='black'}
   if(r===8){glyph='♙';side='white'}
   if(r===9){glyph=whites[c-2];side='white'}
   if(glyph){const p=document.createElement('span');p.className='piece '+side;p.textContent=glyph;d.append(p)}
  }
  board.append(d);
 }
 document.getElementById('legend').textContent=coordMode==='chess'?'SCHACH: Großbuchstaben A–H, Reihen 1–8; Felder im 8×8-Bereich.':coordMode==='go'?'GO: Kleinbuchstaben a–m, Reihen 1–13; Knoten an Gitterkreuzungen.':'BEIDES: Schachfelder sind mit Großbuchstaben bezeichnet, Go-Knoten mit Kleinbuchstaben am Außenrand und Punktmarken.';
}
function open(key){
 const c=chapters.find(x=>x.key===key)||chapters[0];current=c.key;
 content.innerHTML='<div class="eyebrow">'+c.tag+' · Arbeitsstand / nicht G1-freigegeben</div><h1>'+c.title+'</h1>'+c.body;
 const box=document.getElementById('diagram');
 if(box){
  box.innerHTML=boardHTML();draw();
  box.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{coordMode=b.dataset.mode;open(current)}));
  document.getElementById('pieces').addEventListener('click',()=>{showPieces=!showPieces;open(current)});
 }
 nav.querySelectorAll('button').forEach(b=>{if(b.dataset.key===current)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
 const i=chapters.findIndex(x=>x.key===current);
 document.getElementById('prev').disabled=i===0;
 document.getElementById('next').disabled=i===chapters.length-1;
 document.getElementById('progress').textContent=(i+1)+' / '+chapters.length;
 location.hash=current;window.scrollTo(0,0);
}
document.getElementById('prev').addEventListener('click',()=>open(chapters[Math.max(0,chapters.findIndex(x=>x.key===current)-1)].key));
document.getElementById('next').addEventListener('click',()=>open(chapters[Math.min(chapters.length-1,chapters.findIndex(x=>x.key===current)+1)].key));
window.addEventListener('hashchange',()=>{const k=location.hash.slice(1);if(k!==current)open(k)});open(location.hash.slice(1)||'intro');
</script></body></html>
