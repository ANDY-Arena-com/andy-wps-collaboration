<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 466" font-family="Arial,sans-serif"><rect width="900" height="466" rx="12" fill="#fff"/><rect x="20" y="15" width="860" height="72" rx="8" fill="#eef4f7" stroke="#d1dfe8"/><text x="38" y="43" font-size="21" fill="#244c65" font-weight="bold">01 · Situation</text><text x="38" y="67" font-size="17" fill="#243747" >Konkrete Wettbewerbsumgebung</text><rect x="20" y="101" width="860" height="72" rx="8" fill="#eef4f7" stroke="#d1dfe8"/><text x="38" y="129" font-size="21" fill="#244c65" font-weight="bold">02 · Antizipation</text><text x="38" y="153" font-size="17" fill="#243747" >Erwartung zukünftiger Zustände</text><rect x="20" y="187" width="860" height="72" rx="8" fill="#eef4f7" stroke="#d1dfe8"/><text x="38" y="215" font-size="21" fill="#244c65" font-weight="bold">03 · Punch</text><text x="38" y="239" font-size="17" fill="#243747" >Gegner verändert die Voraussetzungen</text><rect x="20" y="273" width="860" height="72" rx="8" fill="#eef4f7" stroke="#d1dfe8"/><text x="38" y="301" font-size="21" fill="#244c65" font-weight="bold">04 · Reorganisation</text><text x="38" y="325" font-size="17" fill="#243747" >Plan gegebenenfalls revidieren</text><rect x="20" y="359" width="860" height="72" rx="8" fill="#eef4f7" stroke="#d1dfe8"/><text x="38" y="387" font-size="21" fill="#244c65" font-weight="bold">05 · Wirkung</text><text x="38" y="411" font-size="17" fill="#243747" >Restabilisierung oder Verlust der Handlungsfähigkeit</text></svg>